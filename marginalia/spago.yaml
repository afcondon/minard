  bundle:
    module: MM.Main
    outfile: public/bundle.js
    platform: browser
  dependencies:
    - aff
    - affjax
    - affjax-web
    - argonaut-codecs
    - argonaut-core
    - arrays
    - bifunctors
    - codec
    - codec-argonaut
    - console
    - datetime
    - effect
    - either
    - enums
    - foldable-traversable
    - halogen
    - hylograph-layout
    - hylograph-selection
    - integers
    - maybe
    - newtype
    - numbers
    - ordered-collections
    - prelude
    - strings
    - tuples
    - web-dom
    - web-html
    - web-uievents
